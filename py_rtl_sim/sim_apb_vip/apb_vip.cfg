# APB master runtime configuration.
timeout_cycle=20000

m0.enable=1
m0.performance_mode=1
m0.base_addr=0x00001000
m0.byte_size=0x00000040
m0.rw_mode=write_read
m0.data_mode=txt
m0.data_value=0x00000000
m0.data_file=../apb_master.txt
m0.pstrb=0xf

# Text mode writes all addr/data pairs, then reads the same addresses and compares data.
